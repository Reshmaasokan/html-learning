<!DOCTYPE html>
<html>
    <head>
        <title>Learning 1 Video Autoplay</title>
    </head>
    <body>
        <div>
        <h1>Sample video</h1>
        <video width="520" height="320" controls autoplay>

            src="./media/samplevideo.mp4"

        </video> 
        </div>
    </body>
</html>

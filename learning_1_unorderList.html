<!DOCTYPE html>
<html>
    <head>
        <title>Unordered List</title>
    </head>
    <body>
        <div>
            <h1>Unordered List circle</h1>
        <ul type="circle">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
       </ul>
        </div>
        <hr>
   

        <div>
            <h1>Unordered List square</h1>
        <ul type="square">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
       </ul>
        </div>
        <hr>
    


        <div>
            <h1>Unordered List disc</h1>
        <ul type="disc">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
       </ul>
        </div>
        <hr>
        
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Pseudo-Element Selectors Example</title>
        <link rel="stylesheet" href="./cssfile/pseudoSelectorExample1.css">
    </head>
    <body>
        <div class="pseudo-element">
            <ul>
                <li>Fruits
                    <ul>
                        <li>Apple</li>
                        <li>Banana</li>
                        <li>Mango</li>
                    </ul>
                </li>
                <li>Vegetable
                    <ul>
                        <li>Carrot</li>
                        <li>Potato</li>
                        <li>Tomato</li>
                    </ul>
                </li>
                <li>Drink
                    <ul>
                        <li>Water</li>
                        <li>juice</li>
                        <li>Milk</li>
                    </ul>
                </li>
            </ul>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Click Event</title>
    </head>
    <body>
        <div>
            <h3>Single Click Events</h3>
            <button 
            id="button1"
            class="button1"
            style="color:white;background-color: red;"
            onclick="console.log('Hello Good Evening!!!!')">
            button 1
        </button>
        </div>

        <div>
            <h3>Double Click Events</h3>
            <button 
            id="button2"
            class="button2"
            style="color:white;background-color: black;"
            ondbclick="console.log('what you want Ramesh ?')">
            button 2
        </button>
        </div>

    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>basic form</title>
    </head>
    <body>
        <div>
            <form method="post" enctype="multipart/form-data">
                <div>
                <label for="Student-name">Enter your name</label>
                <input 
                type="text" 
                id="Student-name" 
                name="studentname"
                placeholder="Ex:Asokan"/>
                </div>

                <div>
                <label for="Student-Rollno">Enter your rollno</label>
                <input
                type="number"
                id="Student-Rollno"
                name="studentrollno"
                placeholder="32">
                </div>

                <div>
                    <label for="Date of admission">Admission data</label>
                    <input 
                    type="date"
                    id="Date of admission" 
                    name="admissiondata">
                </div>

            <div>
                <button type="submit" value="view">click the button</button>
            </div>
                
            </form>
        </div>
    </body>
    
</html>
